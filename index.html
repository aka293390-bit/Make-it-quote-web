<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>makeit quote studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9e9ed;--muted:#92929e;--panel:#17171d;--line:#292932;--accent:#c5a6ff;--bg:#0c0c10}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 72% 0%,#211c2a 0,transparent 35%),var(--bg);color:var(--ink);font:14px 'Noto Sans JP',sans-serif;min-height:100vh}.app{max-width:1460px;margin:auto;padding:34px 38px 48px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}.brand{display:flex;gap:12px;align-items:center}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#e9d9ff,#a781ff);color:#20182e;display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 5px 24px #aa81ff44}.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em}.brand p{margin:2px 0 0;color:var(--muted);font:11px Montserrat,sans-serif;letter-spacing:.12em}.topnote{color:#888894;font-size:12px}.layout{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:26px;align-items:start}.controls{background:#141419;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 20px 70px #0003}.section-title{display:flex;align-items:center;gap:9px;margin:0 0 15px;font-size:13px;font-weight:700}.section-title span{color:var(--accent);font:600 10px Montserrat;letter-spacing:.14em}.group{border-bottom:1px solid var(--line);padding:0 0 18px;margin:0 0 18px}.group:last-of-type{border:0;margin-bottom:0}.field{margin:0 0 13px}.field:last-child{margin-bottom:0}label{display:flex;justify-content:space-between;align-items:center;color:#b9b9c3;font-size:11px;margin-bottom:7px}label em{font-style:normal;color:#72727e;font-size:10px}input[type=text],textarea,select{width:100%;border:1px solid #30303a;border-radius:9px;background:#0d0d12;color:#efedf4;padding:10px 11px;font:13px 'Noto Sans JP',sans-serif;outline:none;transition:.2s}input:focus,textarea:focus,select:focus{border-color:#9b7ad0;box-shadow:0 0 0 3px #b28cff18}textarea{resize:vertical;min-height:65px;line-height:1.6}input[type=color]{width:100%;height:38px;padding:4px;background:#0d0d12;border:1px solid #30303a;border-radius:9px;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range-row{display:flex;align-items:center;gap:10px}input[type=range]{accent-color:#c5a6ff;flex:1}output{width:35px;color:#aaa;font-size:11px;text-align:right}.upload{display:flex;align-items:center;gap:10px}.upload input{font-size:11px;color:#92929e;width:100%}.small-btn{border:1px solid #34333e;background:#211f29;color:#cfc5df;padding:8px 10px;border-radius:8px;white-space:nowrap;cursor:pointer;font-size:11px}.small-btn:hover{border-color:#9e7bdb}.actions{display:flex;gap:9px;margin-top:16px}.primary{flex:1;border:0;border-radius:10px;background:#c9adff;color:#20152e;font-weight:800;padding:13px;cursor:pointer;font:700 13px 'Noto Sans JP';box-shadow:0 6px 24px #b48cff28}.primary:hover{background:#d7c3ff;transform:translateY(-1px)}.secondary{border:1px solid #363540;background:#201f26;color:#c7c5cf;padding:0 13px;border-radius:10px;cursor:pointer;font-size:12px}.stage{min-width:0}.stage-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}.stage-head h2{margin:0;font-size:13px;font-weight:700}.live{display:flex;align-items:center;gap:7px;font-size:10px;color:#a4a3ad;letter-spacing:.06em}.dot{width:6px;height:6px;border-radius:50%;background:#9ce6b1;box-shadow:0 0 9px #9ce6b188}.canvas-wrap{background:#15151b;border:1px solid #2c2b35;border-radius:15px;padding:17px;box-shadow:0 22px 70px #0004}.canvas-inner{width:100%;overflow:hidden;border-radius:5px;background:#000;line-height:0}canvas{width:100%;height:auto;display:block}.tip{display:flex;align-items:flex-start;gap:8px;color:#85848e;font-size:11px;line-height:1.7;margin:13px 3px 0}.tip b{color:#c8aaff;font-size:14px;line-height:1}.presets{display:flex;gap:7px;flex-wrap:wrap}.preset{border:1px solid #34333d;border-radius:99px;padding:6px 10px;color:#aaa7b3;background:#1c1b22;font-size:10px;cursor:pointer}.preset:hover{color:#e1d2ff;border-color:#9471c7}.credit{font:10px Montserrat;color:#65646f;text-align:right;margin-top:12px}@media(max-width:900px){.app{padding:24px 20px}.layout{grid-template-columns:1fr}.controls{order:2}.stage{order:1}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.controls>.section-title,.controls>.actions{grid-column:1/-1}.group{min-width:0}}@media(max-width:560px){.app{padding:18px 12px}.topnote{display:none}.controls{display:block;padding:17px}.canvas-wrap{padding:8px}.stage-head{margin-top:0}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="mark">m</div><div><h1>makeit quote studio</h1><p>DISCORD QUOTE GENERATOR</p></div></div><div class="topnote">ひとことを、あなたらしい一枚に。</div></header>
<div class="layout"><aside class="controls"><h2 class="section-title"><span>01</span> QUOTE SETTINGS</h2>
<section class="group"><div class="field"><label>引用文 <em>改行できます</em></label><textarea id="quote">ハンバーグを
捏製しよう</textarea></div><div class="field"><label>名前・タイトル</label><input id="name" type="text" value="-  PØSKA_TAIKO"></div><div class="field"><label>ユーザー名</label><input id="handle" type="text" value="@poska.taiko"></div></section>
<section class="group"><h3 class="section-title"><span>02</span> AVATAR</h3><div class="field"><label>アイコン画像</label><div class="upload"><input id="avatarFile" type="file" accept="image/*"><button class="small-btn" id="resetAvatar">サンプルに戻す</button></div></div><div class="field"><label>アイコンの大きさ <output id="sizeOut">500</output></label><div class="range-row"><input id="avatarSize" type="range" min="260" max="570" value="500"><output></output></div></div></section>
<section class="group"><h3 class="section-title"><span>03</span> STYLE</h3><div class="field"><label>フォント</label><select id="font"><option value="Noto Sans JP">Noto Sans JP — 日本語ゴシック</option><option value="Zen Maru Gothic">Zen Maru Gothic — やわらか</option><option value="Montserrat">Montserrat — ラテン</option></select></div><div class="field"><label>文字サイズ <output id="fontOut">56</output></label><div class="range-row"><input id="fontSize" type="range" min="34" max="76" value="56"><output></output></div></div><div class="row"><div class="field"><label>背景色</label><input id="bgColor" type="color" value="#000000"></div><div class="field"><label>文字色</label><input id="textColor" type="color" value="#f4f4f5"></div></div><div class="field"><label>背景プリセット</label><div class="presets"><button class="preset" data-bg="#000000">Midnight</button><button class="preset" data-bg="#10131b">Blue hour</button><button class="preset" data-bg="#15111b">Plum</button></div></div></section>
<section class="group"><h3 class="section-title"><span>04</span> FOOTER</h3><div class="field"><label>右下のクレジット</label><input id="credit" type="text" value="Make it a Quote#6660"></div></section>
<div class="actions"><button class="primary" id="download">PNGで保存 ↓</button><button class="secondary" id="reset">初期設定</button></div></aside>
<section class="stage"><div class="stage-head"><h2>プレビュー</h2><div class="live"><i class="dot"></i> LIVE PREVIEW&nbsp; · &nbsp;1200 × 630</div></div><div class="canvas-wrap"><div class="canvas-inner"><canvas id="canvas" width="1200" height="630"></canvas></div></div><p class="tip"><b>✦</b><span>アイコンをアップロードし、文章や書体を調整できます。プレビューは入力に合わせて更新されます。保存画像は1200 × 630pxのPNGです。</span></p><div class="credit">DESIGNED FOR YOUR WORDS</div></section></div></main>
<script>
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');let avatar=null;
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawSample(){const c=document.createElement('canvas');c.width=520;c.height=520;const x=c.getContext('2d');const g=x.createRadialGradient(250,345,30,250,260,260);g.addColorStop(0,'#888');g.addColorStop(.65,'#424248');g.addColorStop(1,'#151519');x.fillStyle=g;x.fillRect(0,0,520,520);x.fillStyle='#08080a';x.beginPath();x.arc(147,210,40,0,Math.PI*2);x.arc(373,210,40,0,Math.PI*2);x.fill();x.strokeStyle='#08080a';x.lineWidth=19;x.lineCap='round';x.beginPath();x.arc(260,268,87,.25*Math.PI,.75*Math.PI);x.stroke();x.fillStyle='#08080a';x.font='900 152px Montserrat';x.textAlign='center';x.fillText('MC',260,490);return c}
avatar=drawSample();
function wrapLines(text,maxWidth,font){ctx.font=font;let lines=[];for(const paragraph of text.split('\n')){if(paragraph===''){lines.push('');continue}let line='';for(const ch of paragraph){const test=line+ch;if(line&&ctx.measureText(test).width>maxWidth){lines.push(line);line=ch}else line=test}lines.push(line)}return lines}
function render(){const W=canvas.width,H=canvas.height,bg=$('bgColor').value,fg=$('textColor').value;ctx.clearRect(0,0,W,H);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
const size=Number($('avatarSize').value), cx=250,cy=315;ctx.save();ctx.beginPath();ctx.arc(cx,cy,size/2,0,Math.PI*2);ctx.clip();if(avatar){const iw=avatar.width,ih=avatar.height,s=Math.max(size/iw,size/ih);ctx.drawImage(avatar,cx-size/2+(size-iw*s)/2,cy-size/2+(size-ih*s)/2,iw*s,ih*s)}ctx.restore();
const family=$('font').value, fontSize=Number($('fontSize').value);const quote=$('quote').value||' ';const maxW=440;let lines=wrapLines(quote,maxW,`400 ${fontSize}px "${family}"`);if(lines.length>3){let fs=fontSize;while(lines.length>3&&fs>34){fs-=2;lines=wrapLines(quote,maxW,`400 ${fs}px "${family}"`)} }
ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=fg;ctx.font=`400 ${fontSize}px "${family}", sans-serif`;const lineH=fontSize*1.34;let y=292-(lines.length-1)*lineH/2;lines.forEach((line,i)=>ctx.fillText(line,850,y+i*lineH,maxW));
ctx.fillStyle=fg;ctx.font=`500 24px Montserrat, "${family}", sans-serif`;ctx.fillText($('name').value,850,402);ctx.fillStyle='#aaaab2';ctx.font=`400 18px Montserrat, "${family}", sans-serif`;ctx.fillText($('handle').value,850,435);
ctx.textAlign='right';ctx.fillStyle='#9999a0';ctx.font=`300 20px "${family}", sans-serif`;ctx.fillText($('credit').value,1180,610,420);
}
const inputs=document.querySelectorAll('input[type=text],textarea,select,input[type=color]');inputs.forEach(el=>el.addEventListener('input',render));$('fontSize').addEventListener('input',e=>{$('fontOut').value=e.target.value;render()});$('avatarSize').addEventListener('input',e=>{$('sizeOut').value=e.target.value;render()});document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{$('bgColor').value=b.dataset.bg;render()}));$('avatarFile').addEventListener('change',e=>{const f=e.target.files[0];if(f){const img=new Image();img.onload=()=>{avatar=img;render()};img.src=URL.createObjectURL(f)}});$('resetAvatar').addEventListener('click',()=>{avatar=drawSample();$('avatarFile').value='';render()});$('download').addEventListener('click',()=>{document.fonts.ready.then(()=>{render();const a=document.createElement('a');a.download='makeit-quote.png';a.href=canvas.toDataURL('image/png');a.click()})});$('reset').addEventListener('click',()=>location.reload());document.fonts.ready.then(render);render();
</script></body></html>
